name: Build Artemis APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Use a fixed debug signing key
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$DEBUG_KEYSTORE_B64" ]; then
            echo "$DEBUG_KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
            echo "Using fixed debug keystore (APK will install as an update)."
          else
            echo "WARNING: DEBUG_KEYSTORE_B64 secret not set; build will use a random key."
          fi

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleNonRoot_gameDebug

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: diana-apk
          path: app/build/outputs/apk/**/*.apk
