name: Build Artemis APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Use a fixed debug signing key
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_B64" ]; then
            echo "$DEBUG_KEYSTORE_B64" | tr -d '\n\r ' | base64 -d > diana-debug.keystore
            echo "Wrote diana-debug.keystore from repository secret."
          elif [ -f debug-keystore.b64 ]; then
            tr -d '\n\r ' < debug-keystore.b64 | base64 -d > diana-debug.keystore
            echo "Wrote diana-debug.keystore from debug-keystore.b64 file."
          else
            echo "ERROR: no fixed keystore available; refusing to build with a random key."
            exit 1
          fi
          # Gradle reads this path explicitly (see app/build.gradle signingConfigs)
          cp diana-debug.keystore ~/.android/debug.keystore 2>/dev/null || mkdir -p ~/.android && cp diana-debug.keystore ~/.android/debug.keystore
          keytool -list -keystore diana-debug.keystore -storepass android | head -5

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleNonRoot_gameDebug

      - name: Report APK signer fingerprint
        run: |
          APK=$(find app/build/outputs/apk -name '*arm64-v8a*.apk' | head -1)
          echo "APK: $APK"
          BT=$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs "$APK" | grep -i "SHA-256 digest" || \
            keytool -printcert -jarfile "$APK" | grep -i "SHA256:"
          echo "^ This fingerprint must be IDENTICAL between builds to install as an update."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: diana-apk
          path: app/build/outputs/apk/**/*.apk
